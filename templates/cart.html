<!DOCTYPE html>
<html>
<head>
    <title>Daisy Store - My Cart</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>
    <h1>Daisy Store 🛍️</h1>
    <h2>My Shopping Cart 🛒</h2>

    <table>
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
        </tr>

        {% for item in cart %}
        <tr>
            <td>{{item.product_name}}</td>
            <td>₹{{item.price}}</td>
            <td>{{item.quantity}}</td>
            <td>₹{{item.price * item.quantity}}</td>
        </tr>
        {% endfor %}
    </table>
    <form method="POST" action="/place_order">
    <button type="submit">Place Order 📦</button>
</form>
</body>
</html>
