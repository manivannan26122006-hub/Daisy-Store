<!DOCTYPE html>
<html>
<head>
    <title>My Orders - Daisy Store</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>
    <h1>Daisy Store 🛍️</h1>
    <h2>My Orders 📦</h2>

    <table>
        <tr>
            <th>Order ID</th>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Status</th>
        </tr>

        {% for order in orders %}
        <tr>
            <td>{{order.id}}</td>
            <td>{{order.product_name}}</td>
            <td>₹{{order.price}}</td>
            <td>{{order.quantity}}</td>
            <td>₹{{order.total}}</td>
            <td>{{order.status}}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
