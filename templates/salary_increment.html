
<!DOCTYPE html>
<html>
<head>
    <title>Daisy Store - Salary Increment</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
    <style>
        .page-card{
            max-width:650px;
            margin:35px auto;
            padding:30px;
            background:white;
            border-radius:15px;
            box-shadow:0 8px 25px #142b4a15;
        }
        .page-card button{
            width:100%;
            margin:12px 0;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>Daisy Store</h1>
        <a href="/dashboard">Dashboard</a>
    </div>

    <div class="page-card">
        <h2>Employee Salary Increment</h2>
        <p>Record and manage employee salary increases.</p>

        <form method="POST" action="/salary_increment">
            <label>Employee ID</label>
            <input type="number" name="employee_id" placeholder="Enter employee ID" required>

            <label>Employee Name</label>
            <input type="text" name="employee_name" placeholder="Enter employee name" required>

            <label>Old Salary (₹)</label>
            <input type="number" step="0.01" name="old_salary" placeholder="Enter old salary" required>

            <label>New Salary (₹)</label>
            <input type="number" step="0.01" name="new_salary" placeholder="Enter new salary" required>

            <label>Increment Date</label>
            <input type="date" name="increment_date" required>

            <button type="submit">Save Salary Increment</button>
        </form>
    </div>
</body>
</html>
