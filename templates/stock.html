<!DOCTYPE html>
<html>
<head>
    <title>Stock Management</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>

<h1>🌸 Daisy Store - Stock Management</h1>
<h2>Available Product Stock</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Product</th>
        <th>Category</th>
        <th>Quantity</th>
        <th>Price</th>
    </tr>

    {% for p in products %}
    <tr>
        <td>{{p.id}}</td>
        <td>{{p.product_name}}</td>
        <td>{{p.category}}</td>
        <td>{{p.quantity}}</td>
        <td>₹{{p.price}}</td>
    </tr>
    {% endfor %}
</table>

<a href="/admin">Back to Admin Dashboard</a>

</body>
</html>
